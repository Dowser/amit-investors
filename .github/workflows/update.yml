name: Uppdatera ställning

on:
  schedule:
    # Var 30:e minut, vardagar, 06:00–17:59 UTC. Fönstret täcker Stockholmsbörsens
    # 09:00–17:30 både under sommartid (UTC+2) och vintertid (UTC+1), så cron
    # behöver inte ändras vid tidsomställningen i oktober.
    - cron: '*/30 6-17 * * 1-5'
    # En sen körning så att slutkursen garanterat fångas efter stängning.
    - cron: '15 18 * * 1-5'
  workflow_dispatch:        # manuell knapp i Actions-fliken
    inputs:
      offline:
        description: 'Nödläge: publicera committad data utan att hämta kurser'
        type: boolean
        default: false
  push:
    branches: [main]
    # Botens återcommits av docs/data triggar inte: de bär skip-ci-markören.
    # OBS: GitHub läser HELA commit-meddelandet efter den markören, även
    # brödtexten — skriv aldrig ut den bokstavligt i ett vanligt commit.
    paths:
      - 'config/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

# Publicering till GitHub Pages kräver dessa rättigheter.
permissions:
  contents: write            # för den dagliga återcommitten av datafilerna
  pages: write
  id-token: write

# Låt en pågående publicering bli klar; köa högst en till.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nyheter cachas mellan körningar. Om Google News fallerar en gång
      # behåller sidan gårdagens rubriker i stället för att visa tom panel.
      # Bara nyheterna: baslinjer och stängningar är committade, så att en
      # manuell rättning i repot inte skrivs över av en äldre cache.
      - name: Återställ nyhetscache
        uses: actions/cache/restore@v4
        with:
          path: docs/data/news.json
          key: amit-news-${{ github.run_id }}
          restore-keys: amit-news-

      - name: Hämta kurser och nyheter
        run: node scripts/update.mjs ${{ inputs.offline && '--offline' || '' }}

      - name: Spara nyhetscache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: docs/data/news.json
          key: amit-news-${{ github.run_id }}

      # Baslinjer och observerade stängningar är det enda tillståndet sidan
      # har. De committas av varje körning som har något nytt, oavsett vad som
      # startade den: GitHubs schema är inte tillförlitligt. Dagens värde skrivs
      # först efter stängning (update.mjs). Före publicering och utan att stoppa
      # den, så att ett fel här inte lämnar sidan gammal.
      - name: Committa tillbaka datafiler
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name  "amit-investors[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.json docs/data/baselines.json
          if git diff --cached --quiet; then
            echo "Inga ändringar i datafilerna."
            exit 0
          fi
          git commit -m "Dagens baslinjer och stängningar [skip ci]"
          if ! git push; then
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
